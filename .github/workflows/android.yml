# Gera o APK assinado do Go, Julls!
# - Manual (Actions > Build APK > Run workflow): APK fica como artefato para baixar.
# - Tag vX.Y.Z (git tag v1.0.1 && git push --tags): cria Release com o .apk e o latest.json.
# Secrets necessários (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # SDK do Android: usa o que vem na imagem; se não houver, baixa as command-line tools oficiais.
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || ! ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager >/dev/null 2>&1; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Versão
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Conferir tag x package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} diferente da versão do package.json (${{ steps.ver.outputs.version }})"; exit 1
          fi

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: npm run build && npx cap sync android

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gojulls-release.jks"

      - name: Gradle assembleRelease
        working-directory: android
        env:
          GOJULLS_KEYSTORE_PATH: ${{ runner.temp }}/gojulls-release.jks
          GOJULLS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GOJULLS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOJULLS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: latest.json
        run: |
          V=${{ steps.ver.outputs.version }}
          cat > latest.json <<EOF
          {"version":"$V","url":"https://github.com/${{ github.repository }}/releases/download/v$V/go-julls-v$V.apk","notes":"Nova versão do Go, Julls!"}
          EOF
          rm -f "$RUNNER_TEMP/gojulls-release.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: go-julls-v${{ steps.ver.outputs.version }}
          path: android/app/build/outputs/apk/release/go-julls-v${{ steps.ver.outputs.version }}.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/go-julls-v${{ steps.ver.outputs.version }}.apk
            latest.json
